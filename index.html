<script>
class Component extends DCLogic {
  componentDidMount() {
    this.cdTimer = setInterval(() => this.setState({ cdNow: Date.now() }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this.cdTimer);
    if (this.voice) this.voice.pause();
    clearTimeout(this.pzScrollTimer);
    clearTimeout(this.msTimer);
    clearTimeout(this.tsTimer);
    clearInterval(this.ofTimer);
    clearTimeout(this.ofLostTimer);
  }
  // ===== 「スタート」後の音声 =====
  // 再生し、終わったら次のページへ移動する。再生が止められた場合は再生ボタンを出す。
  voicePlay(src, nextUrl) {
    if (typeof Audio === 'undefined') return;
    if (!this.voice) {
      const a = new Audio(src);
      a.preload = 'auto';
      a.addEventListener('timeupdate', () => {
        if (a.duration) this.setState({ voicePos: a.currentTime / a.duration });
      });
      a.addEventListener('ended', () => {
        this.setState({ voice: 'done', voicePos: 1 });
        window.location.href = nextUrl;
      });
      this.voice = a;
    }
    const p = this.voice.play();
    this.setState({ voice: 'playing' });
    if (p && p.catch) p.catch(() => this.setState({ voice: 'blocked' }));
  }
  // ===== 一筆書き（Q.17） =====
  // 盤面サイズ・白マスの数の範囲（残りは壁）・制限時間（秒）。すべての白マスを一筆で通ればクリア。
  ofConf() { return { n: 7, minCells: 42, maxCells: 45, limit: 10 }; }
  ofFresh(failed) { return { status: 'ready', open: {}, start: -1, path: [], startedAt: 0, now: 0, failed: failed || 0 }; }
  ofGet() { return this.ofS || (this.ofS = this.ofFresh(0)); }
  ofPut(patch) { this.ofS = Object.assign({}, this.ofGet(), patch); this.setState({ ofRev: ((this.state && this.state.ofRev) || 0) + 1 }); }
  ofNeighbors(i) {
    const n = this.ofConf().n, r = Math.floor(i / n), c = i % n, out = [];
    if (r > 0) out.push(i - n);
    if (r < n - 1) out.push(i + n);
    if (c > 0) out.push(i - 1);
    if (c < n - 1) out.push(i + 1);
    return out;
  }
  // 解ける問題を作る：ランダムな一筆の道を作り、通らなかったマスを壁にする
  ofGenerate() {
    const { n, minCells, maxCells } = this.ofConf();
    const want = minCells + Math.floor(Math.random() * (maxCells - minCells + 1));
    let best = [];
    for (let t = 0; t < 600 && best.length < want; t++) {
      const seen = {};
      const path = [Math.floor(Math.random() * n * n)];
      seen[path[0]] = true;
      for (;;) {
        const last = path[path.length - 1];
        const opts = this.ofNeighbors(last).filter((k) => !seen[k]);
        if (!opts.length) break;
        const deg = (k) => this.ofNeighbors(k).filter((m) => !seen[m]).length;
        let pick;
        if (Math.random() < 0.2) pick = opts[Math.floor(Math.random() * opts.length)];
        else {
          const min = Math.min.apply(null, opts.map(deg));
          const low = opts.filter((k) => deg(k) === min);
          pick = low[Math.floor(Math.random() * low.length)];
        }
        seen[pick] = true;
        path.push(pick);
      }
      if (path.length > best.length) best = path;
    }
    // 道の両端を少し削って白マスの数を調整し、壁を必ず作る
    const cut = Math.max(0, best.length - want);
    const head = Math.floor(Math.random() * (cut + 1));
    best = best.slice(head, best.length - (cut - head));
    if (Math.random() < 0.5) best = best.slice().reverse();
    const open = {};
    best.forEach((k) => { open[k] = true; });
    return { open, start: best[0] };
  }
  ofStart() {
    const s = this.ofGet();
    if (s.status !== 'ready') return;
    const p = this.ofGenerate();
    clearInterval(this.ofTimer);
    const now = Date.now();
    this.ofPut({ status: 'playing', open: p.open, start: p.start, path: [p.start], startedAt: now, now });
    this.ofTimer = setInterval(() => this.ofTick(), 200);
  }
  ofTick() {
    const s = this.ofGet();
    if (s.status !== 'playing') { clearInterval(this.ofTimer); return; }
    const now = Date.now();
    if (now - s.startedAt >= this.ofConf().limit * 1000) {
      // 時間切れ：失敗。少し見せてから新しいランダム問題に入れ替える
      clearInterval(this.ofTimer);
      this.ofPut({ status: 'lost', now });
      clearTimeout(this.ofLostTimer);
      this.ofLostTimer = setTimeout(() => this.ofPut(this.ofFresh(s.failed + 1)), 1800);
      return;
    }
    this.ofPut({ now });
  }
  ofEnter(i, qIndex) {
    const s = this.ofGet();
    if (s.status !== 'playing' || !s.open[i]) return;
    const p = s.path;
    const last = p[p.length - 1];
    if (i === last) return;
    let path;
    if (p.length >= 2 && i === p[p.length - 2]) path = p.slice(0, -1);
    else if (p.indexOf(i) !== -1) path = p.slice(0, p.indexOf(i) + 1);
    else if (this.ofNeighbors(last).indexOf(i) !== -1) path = p.concat([i]);
    else return;

      clearInterval(this.ofTimer);
      this.ofS = Object.assign({}, s, { path, status: 'won', now: Date.now() });
      this.setState({
        ofRev: ((this.state && this.state.ofRev) || 0) + 1,
        pzSolved: Object.assign({}, this.state && this.state.pzSolved, { [qIndex]: true }),
        pzResults: Object.assign({}, this.state && this.state.pzResults, { [qIndex]: 'correct' })

  // ===== スリーシェルゲーム（Q.28） =====
  // ラウンドごとの入れ替え回数と1回の速さ（ミリ秒）。3ラウンド連続で正解するとクリア。
  tsRounds() { return [{ swaps: 12, ms: 280 }, { swaps: 18, ms: 210 }, { swaps: 24, ms: 190 }]; }
  tsFresh(failed) { return { slots: [0, 1, 2], ball: -1, status: 'ready', round: 1, lifted: {}, picked: -1, front: -1, back: -1, ms: 280, failed: failed || 0 }; }
  tsSet(patch) {
    const cur = (this.state && this.state.ts) || this.tsFresh(0);
    this.setState({ ts: Object.assign({}, cur, patch) });
  }
  tsStart() {
    const cur = (this.state && this.state.ts) || this.tsFresh(0);
    if (cur.status !== 'ready' && cur.status !== 'roundWin') return;
    const round = cur.status === 'roundWin' ? cur.round + 1 : 1;
    const cfg = this.tsRounds()[round - 1];
    const slots = [0, 1, 2];
    for (let i = 2; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = slots[i]; slots[i] = slots[j]; slots[j] = t; }
    const ball = Math.floor(Math.random() * 3);
    clearTimeout(this.tsTimer);
    this.tsSet({ slots, ball, round, status: 'reveal', lifted: { [ball]: true }, picked: -1, front: -1, back: -1, ms: cfg.ms });
    this.tsTimer = setTimeout(() => {
      this.tsSet({ lifted: {}, status: 'shuffle' });
      this.tsTimer = setTimeout(() => this.tsStep(cfg.swaps, cfg), 450);
    }, 1100);
  }
  tsStep(left, cfg) {
    const cur = (this.state && this.state.ts) || this.tsFresh(0);
    if (cur.status !== 'shuffle') return;
    if (left <= 0) { this.tsSet({ status: 'pick', front: -1, back: -1 }); return; }
    const a = Math.floor(Math.random() * 3);
    const b = (a + 1 + Math.floor(Math.random() * 2)) % 3;
    const slots = cur.slots.slice();
    const ca = slots.indexOf(a), cb = slots.indexOf(b);
    slots[ca] = b; slots[cb] = a;
    const fwd = Math.random() < 0.5;
    this.tsSet({ slots, front: fwd ? ca : cb, back: fwd ? cb : ca });

  }
  tsPick(cup, qIndex) {
    const s = this.state || {};
    const cur = s.ts || this.tsFresh(0);
    if (cur.status !== 'pick') return;
    if (cup === cur.ball) {
      const last = cur.round >= this.tsRounds().length;
      const next = { ts: Object.assign({}, cur, { status: last ? 'won' : 'roundWin', lifted: { [cup]: true }, picked: cup }) };
      if (last) {

        next.pzResults = Object.assign({}, s.pzResults, { [qIndex]: 'correct' });

    const pool = [];
    for (let i = 0; i < rows * cols; i++) if (!banned.has(i)) pool.push(i);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;

    pool.slice(0, mines).forEach((i) => { m[i] = true; });

  msOpen(i, qIndex) {
    const s = this.state || {};
    const m = s.ms || this.msFresh(0);
    if (m.status === 'lost' || m.status === 'won') return;
    if (s.msFlagMode) { this.msFlag(i); return; }
    if (m.flag[i] || m.rev[i]) return;
    const mines = m.mines || this.msGenerate(i);
    if (mines[i]) {

        note: idx === OF_Q ? {
          title: 'Q.17 は一筆書き',
          body: '赤枠のマスからスタートし、指でなぞって白いマスをすべて一度ずつ通れば正解です。斜めには進めません。制限時間は10秒。時間切れになると問題がランダムに入れ替わります。',
          solved: !!solved[OF_Q]
        } : idx === TS_Q ? {
          title: 'Q.28 はスリーシェルゲーム',
          body: 'ボールの入ったカップを見抜き、3ラウンド連続で当てれば正解です。ラウンドごとにシャッフルが速くなります。外すと配置がランダムに入れ替わり、ラウンド1からやり直しです。',
          solved: !!solved[TS_Q]
        } : {
          title: 'Q.15 はマインスイーパー',
          body: '地雷を避けて、すべてのマスを開ければ正解です。地雷を踏むと盤面がランダムに入れ替わります。旗はモード切替ボタンで立てられます。',
          solved: !!solved[MS_Q]
        },
        total,
        current: idx + 1,
        currentNo: onPlace ? '謎の場所' : 'Q.' + pad(idx + 1),
        input: inputs[idx] || '',
        onInput,
        submit,
        isCorrectQ: result === 'correct' && !onPlace,
        isCorrectPlace: result === 'correct' && onPlace,
        placeSolved: !!solved[total],
        showStep1: !!solved[total] && !st.pzStarted,
        showStep2: !!st.pzStarted,
        voice: {
          title: st.voice === 'done' ? '次のページへ移動しています…'
            : st.voice === 'blocked' ? '下のボタンを押して音声を再生してください。'
            : '音声を再生中です。音量を上げて、最後までお聞きください。',
          body: '音声が終わると、自動で次のページへ移動します。',
          progress: Math.min(100, (st.voicePos || 0) * 100).toFixed(1) + '%',
          showPlay: st.voice === 'blocked',
          done: st.voice === 'done',
          nextUrl: NEXT_URL,
          play: () => this.voicePlay(START_VOICE, NEXT_URL)
        },
        isStart: result === 'start' && onPlace,
        isWrong: result === 'wrong',
        isEmpty: result === 'empty',
        isTooEarly: result === 'early' && onPlace,
        startLabel: START_LABEL,
        solvedCount: Object.keys(solved).filter((k) => +k < total).length,
        allSolved: Object.keys(solved).filter((k) => +k < total).length >= total,
        placeRows,
        onPlace,
        onPuzzle: !onPlace,
        progress: ((pos + 1) / slideCount * 100).toFixed(2) + '%',
        atStart: false,
        atEnd: false,
        prevOpacity: 1,
        nextOpacity: 1,
        onTouchStart,
        onTouchEnd,
        trackRef: (el) => { this.track = el; },
        onScroll: (e) => {
          const t = e.currentTarget;
          if (!t || !t.clientWidth) return;
          // スクロールが止まってから現在の問題番号を確定し、移動中の表示のチラつきを防ぐ
          clearTimeout(this.pzScrollTimer);
          this.pzScrollTimer = setTimeout(() => {
            const n = Math.round(t.scrollLeft / t.clientWidth);
            if (n !== ((this.state && this.state.pzIndex) || 0)) this.setState({ pzIndex: n });
          }, 120);
        },
        prev: () => go(pos - 1),
        next: () => go(pos + 1)
      }
    };
  }
}
dcMount(Component, document.getElementById('dc-tpl'), document.getElementById('dc-root'), {"accent": "#FFE100", "previewPuzzles": false});
</script>
</body>
</html>
